<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="luminaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8824C"/>
      <stop offset="50%" stop-color="#DE7945"/>
      <stop offset="100%" stop-color="#B85928"/>
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FCECE0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#5A2208" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Rectangle -->
  <rect width="64" height="64" rx="16" fill="url(#luminaGrad)"/>
  
  <!-- Subtle Architectural Inner Border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5"/>
  
  <!-- Architectural Arch Contour Accent -->
  <path d="M16 48 V27 C16 18 23.5 11 32.5 11 C41.5 11 49 18 49 27 V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.75" stroke-linecap="round"/>
  
  <!-- Elegant Lumina "L" Monogram -->
  <path d="M21 16 H28.5 V40.5 H44 V47 H21 V16 Z" fill="url(#goldShine)" filter="url(#shadow)"/>
  
  <!-- Luxury Sparkle / Illumination Star Accent -->
  <path d="M44 14 Q44 20.5 50.5 20.5 Q44 20.5 44 27 Q44 20.5 37.5 20.5 Q44 20.5 44 14 Z" fill="#FFFFFF" opacity="0.95"/>
